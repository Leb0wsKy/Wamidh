[project]
name = "wamidh-spread"
version = "0.1.0"
description = "Wamidh: fire spread prediction, physics ensemble corrected by sensor alerts (ADR 0004)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.setuptools.package-data]
wamidh_spread = ["py.typed"]
