[project]
name = "wamidh-backend"
version = "0.1.0"
description = "Wamidh backend: MQTT ingest, node state, incidents, REST + WebSocket API"
requires-python = ">=3.11"
dependencies = [
    "wamidh-contracts",
    "wamidh-spread",  # fire spread engine (ADR 0004), imported in-process
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiomqtt>=2.3",
    "sqlalchemy>=2.0",
    # PostgreSQL + PostGIS store (ADR 0002)
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pyyaml>=6.0",
    # offline routing (routing.py)
    "numpy>=1.26",
    "scipy>=1.11",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a PostgreSQL + PostGIS (WAMIDH_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Libraries without type stubs; their call sites are covered by tests.
module = ["yaml", "scipy.*", "shapely.*", "geopandas", "wamidh_contracts.*", "wamidh_contracts", "geoalchemy2", "geoalchemy2.*"]
ignore_missing_imports = true
